<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atlas de telas — Last Track Standing</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 40px;
        background: #e9e9e6;
        color: #20251f;
        font:
          14px "Segoe UI",
          Arial,
          sans-serif;
      }
      a {
        color: inherit;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: center;
        max-width: 1600px;
        margin: auto;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -1px;
      }
      p {
        color: #68725f;
        line-height: 1.6;
      }
      .row {
        max-width: 1600px;
        margin: 36px auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      h2 {
        font-size: 18px;
      }
      .card {
        min-width: 0;
        background: #151a13;
        border-radius: 10px;
        overflow: hidden;
        color: white;
        text-decoration: none;
        display: block;
      }
      .card p {
        color: #dde6d5;
        padding: 0 15px;
        font-size: 12px;
      }
      .card img {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        object-position: top;
      }
      .route {
        font: 11px monospace;
        color: #747b6e;
      }
      .note {
        font-size: 11px;
      }
      .back {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 8px;
        background: #20261b;
        color: white;
        text-decoration: none;
      }
      @media (max-width: 700px) {
        body {
          padding: 20px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        header {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p>LAST TRACK STANDING / ATLAS VISUAL</p>
        <h1>Todas as telas. Três identidades.</h1>
        <p>
          Miniaturas recortadas para comparação. Clique para abrir a tela
          completa e alternar desktop/mobile.
        </p>
      </div>
      <a class="back" href="index.html">Abrir galeria interativa ↗</a>
    </header>
    <main id="atlas"></main>
    <script src="catalog.js"></script>
    <script>
      document.getElementById("atlas").innerHTML = screens
        .map(
          (s, i) =>
            `<section class="row"><h2>${String(i + 1).padStart(2, "0")} / ${s.title}</h2><p class="route">${s.route}</p><div class="grid">${Object.entries(
              identities,
            )
              .map(
                ([k, t]) =>
                  `<a class="card" href="index.html?screen=${s.id}&identity=${k}"><p>${k.toUpperCase()} / ${t.name}</p><img loading="lazy" src="exports/${k}/desktop/${s.id}.png" alt="${s.title} — ${t.name}"></a>`,
              )
              .join("")}</div><p class="note">${s.note}</p></section>`,
        )
        .join("");
    </script>
  </body>
</html>
